name: cfip
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Speedtest
        run: |
          mkdir -p results cfst_dir
          URL=$(curl -fsSL https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep browser_download_url | grep linux_amd64 | head -n 1 | cut -d '"' -f 4)
          echo "下载地址: $URL"
          curl -fSL -o cfst.tar.gz "$URL"
          tar xzf cfst.tar.gz -C cfst_dir
          BIN=$(find cfst_dir -type f \( -name 'cfst' -o -name 'CloudflareST' \) | head -n 1)
          echo "程序路径: $BIN"
          chmod +x "$BIN"
          cd "$(dirname "$BIN")"
          ./$(basename "$BIN") -dn 20 -tl 200 -url "https://speed.cloudflare.com/__down?bytes=50000000" -o "$GITHUB_WORKSPACE/results/result.csv"
          cd "$GITHUB_WORKSPACE"
          awk -F, 'NR>1 && $6>0 {print $1}' results/result.csv | head -n 20 > results/ip.txt
          if [ ! -s results/ip.txt ]; then
            echo "没有测出下载速度，改用延迟排序"
            tail -n +2 results/result.csv | head -n 20 | cut -d, -f1 > results/ip.txt
          fi
          echo "ip.txt 行数:"
          wc -l results/ip.txt
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add results
          git commit -m "优选更新 $(date -u +%FT%TZ)" || exit 0
          git push
