name: cfip
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Speedtest
        run: |
          mkdir -p results cfst_dir
          URL=$(curl -fsSL https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep browser_download_url | grep linux_amd64 | head -n 1 | cut -d '"' -f 4)
          echo "下载地址: $URL"
          curl -fSL -o cfst.tar.gz "$URL"
          tar xzf cfst.tar.gz -C cfst_dir
          echo "解压内容:"
          ls -R cfst_dir
          BIN=$(find cfst_dir -type f \( -name 'cfst' -o -name 'CloudflareST' \) | head -n 1)
          echo "程序路径: $BIN"
          chmod +x "$BIN"
          cd "$(dirname "$BIN")"
          ./$(basename "$BIN") -dn 10 -tl 200 -o "$GITHUB_WORKSPACE/results/result.csv"
          cd "$GITHUB_WORKSPACE"
          tail -n +2 results/result.csv | cut -d, -f1 > results/ip.txt
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add results
          git commit -m "优选更新 $(date -u +%FT%TZ)" || exit 0
          git push
